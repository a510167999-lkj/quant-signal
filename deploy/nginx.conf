server {
    server_name quant.agentslee.online;
    absolute_redirect off;

    auth_basic "Private Quant Signal";
    auth_basic_user_file /etc/nginx/.quant_signal_htpasswd;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    listen 127.0.0.1:8443 ssl;
    ssl_certificate /etc/letsencrypt/live/quant.agentslee.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quant.agentslee.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = quant.agentslee.online) {
        return 301 https://$host$request_uri;
    }
    server_name quant.agentslee.online;
    listen 80;
    return 404;
}
